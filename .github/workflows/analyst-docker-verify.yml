name: Analyst Docker verification (D2 + B3)

# Ad-hoc verification workflow: GitHub-hosted runners have real Docker (unlike a
# nested-container-restricted sandbox), so this exercises the analyst lifecycle
# acceptance targets that need an actual Docker-built verifier image:
#   D2 full lifecycle e2e, B3 built-renderer integration e2e.
# Not part of normal CI; runs only on pushes to this dedicated branch.

on:
  push:
    branches:
      - analyst-ci-verify

env:
  DATABASE_URL: "postgresql://ai_synthetic@127.0.0.1:25432/ai_synthetic?schema=public"
  PG_BIN: "/usr/lib/postgresql/16/bin"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_synthetic
          POSTGRES_DB: ai_synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U ai_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: ai_synthetic
          CLICKHOUSE_PASSWORD: synthetic-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 28123:8123
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Pi 1.4.0
        run: |
          npm ci --prefix scripts/ai/install \
            --install-strategy=nested --ignore-scripts
          scope=scripts/ai/install/node_modules/@earendil-works
          pi_root="$(realpath "$scope/pi-coding-agent")"
          version="$(node -p \
            "JSON.parse(require('fs').readFileSync(\
            '$pi_root/package.json')).version")"
          test "$version" = 1.4.0
          AI_PI_ROOT="$pi_root" node scripts/ai/native.mjs --version
          echo "AI_PI_ROOT=$pi_root" >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium

      - name: Fixture ownership markers (postgres + clickhouse)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "PG_BIN=$(dirname "$(command -v psql)")" >> "$GITHUB_ENV"
          psql -h 127.0.0.1 -p 25432 -U ai_synthetic -d ai_synthetic -v ON_ERROR_STOP=1 -c \
            "create table ai_synthetic_owner (owner text); insert into ai_synthetic_owner values ('umami-ai-synthetic-r3');"
          curl --retry 10 --retry-delay 2 --retry-connrefused --silent --fail \
            --user ai_synthetic:synthetic-only http://127.0.0.1:28123/ping

      - name: A1-A3 foundation acceptance (sanity re-check)
        run: |
          pnpm exec prisma generate
          pnpm exec vitest run src/lib/analyst src/permissions/analysis.test.ts src/queries/prisma/analysis.test.ts src/lib/boards.test.ts
          PGOPTIONS='-c timezone=America/New_York' \
            pnpm exec tsx scripts/test-analyst-api.ts --postgres
          PGOPTIONS='-c timezone=America/New_York' \
            pnpm exec tsx scripts/test-analyst-api.ts --clickhouse

      - name: Build own workspace artifacts and check integration contracts
        run: |
          pnpm build:openapi
          pnpm build:packages
          pnpm exec tsc --noEmit
          pnpm openapi:check
          pnpm check:api:client
          git diff --exit-code

      - name: Build restricted verifier Docker image
        run: sh scripts/ai/verifier/build-image.sh

      - name: B1-B2 verifier acceptance (sanity re-check)
        run: |
          node --test scripts/ai/verifier/*.test.mjs
          PLAYWRIGHT_SKIP_WEB_SERVER=1 pnpm exec playwright test -c playwright.config.ts tests/e2e/analyst-verifier.spec.ts

      - name: Sequential D2 flags-on/off and B3 with source-paired receipts
        timeout-minutes: 30
        run: |
          mkdir -p analyst-evidence
          pnpm exec tsx scripts/ai/analyst-evals/browser-proof.ts \
            analyst-evidence/browser.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            analyst-evidence/
          retention-days: 7
